<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハスキー☆ブラスター</title>
<style>
body{margin:0;overflow:hidden;background:#111;color:white;font-family:sans-serif}
canvas{display:block;background:linear-gradient(#1b2745,#274060)}
#info{position:fixed;top:10px;left:10px;z-index:10}
.controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:20px}
button{width:80px;height:80px;border:none;border-radius:20px;font-size:30px;background:rgba(255,255,255,.2);color:white}
#fire{width:110px;height:110px;border-radius:999px}
</style>
</head>
<body>
<div id="info">🐺 ハスキー☆ブラスター</div>
<canvas id="game"></canvas>

<div class="controls">
<div>
<button id="up">⬆️</button>
<button id="down">⬇️</button>
<button id="left">⬅️</button>
<button id="right">➡️</button>
</div>
<button id="fire">💥</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let keys={up:false,down:false,left:false,right:false};
let bullets=[];
let enemies=[];
let score=0;

const player={x:100,y:200,w:80,h:60,speed:6};

function bind(id,key){
const b=document.getElementById(id);
b.ontouchstart=e=>{e.preventDefault();keys[key]=true;}
b.ontouchend=e=>{e.preventDefault();keys[key]=false;}
}
bind("up","up");
bind("down","down");
bind("left","left");
bind("right","right");

document.getElementById("fire").ontouchstart=e=>{
e.preventDefault();
bullets.push({x:player.x+70,y:player.y+20});
};

setInterval(()=>{
enemies.push({
x:canvas.width+50,
y:Math.random()*canvas.height,
r:30,
speed:3+Math.random()*3
});
},900);

function drawPlayer(){
ctx.fillStyle="#ddd";
ctx.fillRect(player.x,player.y,55,35);

ctx.fillStyle="#fff";
ctx.beginPath();
ctx.arc(player.x+58,player.y+16,18,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="skyblue";
ctx.beginPath();
ctx.arc(player.x+63,player.y+14,3,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#fc0";
ctx.fillRect(player.x+70,player.y+12,18,6);
}

function loop(){
ctx.clearRect(0,0,canvas.width,canvas.height);

if(keys.up)player.y-=player.speed;
if(keys.down)player.y+=player.speed;
if(keys.left)player.x-=player.speed;
if(keys.right)player.x+=player.speed;

drawPlayer();

bullets.forEach((b,i)=>{
b.x+=10;
ctx.fillStyle="cyan";
ctx.beginPath();
ctx.arc(b.x,b.y,6,0,Math.PI*2);
ctx.fill();
});

enemies.forEach((e,ei)=>{
e.x-=e.speed;

ctx.fillStyle="red";
ctx.beginPath();
ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
ctx.fill();

bullets.forEach((b,bi)=>{
const dx=b.x-e.x;
const dy=b.y-e.y;
if(Math.sqrt(dx*dx+dy*dy)<30){
enemies.splice(ei,1);
bullets.splice(bi,1);
score+=10;
}
});
});

ctx.fillStyle="white";
ctx.font="24px sans-serif";
ctx.fillText("SCORE:"+score,20,50);

requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
